<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARLAND — Ingeniero Full-Stack e IA</title>
    <meta name="description" content="Construyo sistemas completos, desde la aplicación hasta producción. Full-Stack, AI, Automatización e Infraestructura." />
    <meta property="og:title" content="ARLAND — Ingeniero Full-Stack e IA" />
    <meta property="og:description" content="Construyo sistemas completos, desde la aplicación hasta producción. Full-Stack, AI, Automatización e Infraestructura." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arlandstack.com/" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:image" content="https://arlandstack.com/brand/og-arlandstack.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ARLAND — Ingeniero Full-Stack e IA · arlandstack.com" />
    <link rel="canonical" href="https://arlandstack.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Ciclo 16 (#10): favicon vectorial + respaldos PNG/ICO, apple-touch-icon y manifest. Ver .docs/027-favicon-jsonld.md -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0D0D0F" />
    <!-- Ciclo 16 (#10): datos estructurados. application/ld+json no se ejecuta, por eso la CSP (script-src sin 'unsafe-inline') no lo bloquea. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://arlandstack.com/#arland",
          "name": "Arland E. Michelena Villegas",
          "alternateName": "Arland Michelena",
          "jobTitle": "Desarrollador fullstack y Agentforce",
          "url": "https://arlandstack.com/",
          "image": "https://arlandstack.com/brand/og-arlandstack.png",
          "knowsLanguage": ["es", "en", "it", "fr"],
          "sameAs": [
            "https://github.com/ArlandMv",
            "https://www.linkedin.com/in/arland-michelena"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://arlandstack.com/#sitio",
          "name": "ARLAND — Ingeniero Full-Stack e IA",
          "url": "https://arlandstack.com/",
          "inLanguage": "es",
          "author": { "@id": "https://arlandstack.com/#arland" },
          "publisher": { "@id": "https://arlandstack.com/#arland" }
        }
      ]
    }
    </script>
    <!-- Ciclo 14: precarga de la imagen LCP (gema del hero). Mismo srcset/sizes que el <source> AVIF de HeroSection. -->
    <link rel="preload" as="image" type="image/avif" fetchpriority="high"
      imagesrcset="/brand/logo-mark-320.avif 320w, /brand/logo-mark-480.avif 480w, /brand/logo-mark-640.avif 640w"
      imagesizes="(min-width: 640px) 320px, 288px" />
    <!-- Ciclo 15 (#65): Cloudflare Web Analytics inyecta beacon.min.js al final del body desde el edge.
         Solo resolvemos DNS por adelantado (sin preconnect, para no competir con la imagen LCP). Ver .docs/026-turnstile-diferido.md. -->
    <link rel="dns-prefetch" href="https://static.cloudflareinsights.com" />
  </head>
  <body class="bg-[#0D0D0F] text-[#F4F1ED] antialiased selection:bg-[#7A2E84] selection:text-[#F4F1ED]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
